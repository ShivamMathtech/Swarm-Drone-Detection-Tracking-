services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./weights:/app/weights:ro
      - ./runtime:/app/runtime
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
